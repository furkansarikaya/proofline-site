name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # measured 2026-11-20: run 44704593187 1 min 6 s, run 44704839510 47 s
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: install
        run: npm ci && npx playwright install --with-deps chromium
      - name: node --test
        run: npm test
      - name: build
        run: npm run build
      - name: determinism compare
        run: npm run check:determinism
      - name: link check
        run: npm run check:links
      - name: axe
        run: npm run test:axe
      - name: performance slot
        run: 'echo "performance checks skipped: the Lighthouse budgets arrive with the performance task"'
