name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: install
        run: npm ci && npx playwright install --with-deps chromium
      - name: node --test
        run: npm test
      - name: build
        run: npm run build
      - name: determinism compare
        run: npm run check:determinism
      - name: link check
        run: npm run check:links
      - name: axe
        run: npm run test:axe
      - name: performance slot
        run: 'echo "performance checks skipped: the Lighthouse budgets arrive with the performance task"'
